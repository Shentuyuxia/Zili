name: Generate voice audio
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many texts (words + example sentences) to generate; 0 = all"
        default: "40"
      voice:
        description: "Azure voice"
        default: "zh-CN-XiaoxiaoNeural"
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 tools/build_tts.py --limit "${{ inputs.limit }}" --voice "${{ inputs.voice }}"
      - name: Commit
        run: |
          git config user.name "zili-bot"; git config user.email "zili-bot@users.noreply.github.com"
          git add audio/tts && (git diff --cached --quiet || git commit -m "Voice audio: new files" && git push)
